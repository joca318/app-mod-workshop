steps:
# Build the image
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'us-central1-docker.pkg.dev/app-mod-workshop01/cloud-run-source-deploy/app-mod-workshop', '.']
# Push the image to Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'us-central1-docker.pkg.dev/app-mod-workshop01/cloud-run-source-deploy/app-mod-workshop']
# Deploy image to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args: ['run', 'deploy', 'app-mod-workshop', '--image', 'us-central1-docker.pkg.dev/app-mod-workshop01/cloud-run-source-deploy/app-mod-workshop', '--region', 'us-central1']
images:
- 'us-central1-docker.pkg.dev/app-mod-workshop01/cloud-run-source-deploy/app-mod-workshop'